  :root { --paper: #F4F3F5; --ink: #151316; --steel: #625D66; --rule: rgba(21,19,22,.13); --magenta: #C20E62; --on-accent: #fff; }

  a.accent { background: var(--magenta); border-color: var(--magenta); color: var(--on-accent); }
