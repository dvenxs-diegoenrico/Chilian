<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Chilian OS</title>
<link rel="icon" href="/favicon.png">
<link rel="preload" href="/fonts/big-shoulders-display.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Big Shoulders Display"; font-weight: 700 900; font-display: swap; src: url(/fonts/big-shoulders-display.woff2) format("woff2"); }
  @font-face { font-family: "Instrument Sans"; font-weight: 400 700; font-display: swap; src: url(/fonts/instrument-sans.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-display: swap; src: url(/fonts/ibm-plex-mono-400.woff2) format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: swap; src: url(/fonts/ibm-plex-mono-500.woff2) format("woff2"); }
  /* Chilian OS: the plant's work order as software. Ink bar on the left, paper
     workspace, monospace for every folio, number and date. */
  :root {
    --paper: #F4F3F5; --card: #FFFFFF; --ink: #151316; --steel: #625D66; --rule: rgba(21,19,22,.13); --shade: rgba(21,19,22,.05);
    --magenta: #C20E62; --on-accent: #FFFFFF; --ok: #3F7A0A; --warn: #B4541A; --bad: #C8322B; --info: #1F64B5;
    --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --f-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --paper: #121013; --card: #1B181C; --ink: #EFEDF0; --steel: #A7A1AB; --rule: rgba(239,237,240,.14); --shade: rgba(239,237,240,.05);
    --magenta: #FF4D9D; --on-accent: #120A0E; --ok: #9BD84A; --warn: #FF9A5C; --bad: #FF6B60; --info: #6FB0FF; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --paper: #121013; --card: #1B181C; --ink: #EFEDF0; --steel: #A7A1AB; --rule: rgba(239,237,240,.14); --shade: rgba(239,237,240,.05);
    --magenta: #FF4D9D; --on-accent: #120A0E; --ok: #9BD84A; --warn: #FF9A5C; --bad: #FF6B60; --info: #6FB0FF; color-scheme: dark; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--magenta); outline-offset: 2px; }
  .mono { font-family: var(--f-mono); }
  .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

  /* shell */
  .shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; }
  .side { background: var(--ink); color: var(--paper); display: flex; flex-direction: column; gap: .2rem; padding: calc(1rem + env(safe-area-inset-top, 0px)) .7rem 1rem max(.7rem, env(safe-area-inset-left, 0px)); position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: .55rem; padding: .2rem .5rem 1rem; }
  .brand i { width: 28px; height: 28px; background: var(--paper); -webkit-mask: url(/logos/chilian-c.png) center/contain no-repeat; mask: url(/logos/chilian-c.png) center/contain no-repeat; }
  .brand b { font: 900 1.35rem/1 var(--f-display); letter-spacing: .12em; }
  .brand small { display: block; font: 500 .55rem var(--f-mono); letter-spacing: .2em; opacity: .65; }
  .nav a { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .55rem .65rem; text-decoration: none; border-radius: 2px; font-weight: 500; color: color-mix(in srgb, var(--paper) 78%, transparent); transition: background-color .2s ease, color .2s ease; }
  .nav a:hover { background: color-mix(in srgb, var(--paper) 10%, transparent); color: var(--paper); }
  .nav a.on { background: var(--paper); color: var(--ink); }
  .nav .count { font: 600 .66rem var(--f-mono); padding: .05rem .4rem; border-radius: 999px; background: var(--magenta); color: var(--on-accent); }
  .nav .group { font: 500 .58rem var(--f-mono); letter-spacing: .16em; text-transform: uppercase; opacity: .5; padding: .9rem .65rem .3rem; }
  .side .me { margin-top: auto; padding: .8rem .65rem 0; border-top: 1px solid color-mix(in srgb, var(--paper) 18%, transparent); font-size: .82rem; display: grid; gap: .3rem; }
  .side .me button { all: unset; cursor: pointer; font: 500 .68rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
  .side .me button:hover { opacity: 1; }
  .main { min-width: 0; padding: calc(1.2rem + env(safe-area-inset-top, 0px)) max(1.2rem, env(safe-area-inset-right, 0px)) 4rem 1.6rem; }
  .topbar { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: .8rem 1rem; margin-bottom: 1.2rem; }
  .topbar h1 { margin: 0; font: 800 clamp(2rem, 3.6vw, 2.8rem)/.92 var(--f-display); text-transform: uppercase; }
  .topbar .sub { font: 500 .7rem var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--steel); margin-bottom: .35rem; }
  .actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .mobile-bar { display: none; }
  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: fixed; inset: 0 auto 0 0; width: min(280px, 86vw); z-index: 30; transform: translateX(-100%); transition: transform .25s ease; height: 100%; }
    .side.open { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); }
    .mobile-bar { display: flex; align-items: center; justify-content: space-between; gap: .6rem; position: sticky; top: 0; z-index: 20; background: var(--ink); color: var(--paper); padding: calc(.55rem + env(safe-area-inset-top, 0px)) max(.9rem, env(safe-area-inset-right, 0px)) .55rem max(.9rem, env(safe-area-inset-left, 0px)); }
    .mobile-bar b { font: 900 1.1rem var(--f-display); letter-spacing: .12em; }
    .main { padding: 1rem max(16px, env(safe-area-inset-right, 0px)) 4rem max(16px, env(safe-area-inset-left, 0px)); }
  }

  /* controls */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; padding: .6rem .9rem; border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 2px; cursor: pointer; font: 600 .72rem/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; text-decoration: none; transition: background-color .2s ease, color .2s ease, transform .15s ease; white-space: nowrap; }
  .btn:hover { background: var(--paper); color: var(--ink); }
  .btn:active { transform: scale(.97); }
  .btn.accent { background: var(--magenta); border-color: var(--magenta); color: var(--on-accent); }
  .btn.accent:hover { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn.ghost:hover { background: var(--ink); color: var(--paper); }
  .btn.sm { padding: .4rem .6rem; font-size: .64rem; }
  .btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
  .btn:disabled { opacity: .45; pointer-events: none; }
  .link { all: unset; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; color: var(--ink); }
  .link:hover { color: var(--magenta); }
  label.f { display: grid; gap: .3rem; min-width: 0; }
  label.f > span { font: 500 .62rem/1.3 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--steel); }
  input.i, select.i, textarea.i { width: 100%; padding: .55rem .65rem; border: 1px solid var(--rule); background: var(--card); border-radius: 2px; min-width: 0; }
  input.i:focus, select.i:focus, textarea.i:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px var(--shade); }
  textarea.i { min-height: 80px; resize: vertical; }
  .grid { display: grid; gap: .8rem; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 700px) { .g2, .g3, .g4 { grid-template-columns: 1fr; } }
  .full { grid-column: 1 / -1; }
  .chips { display: flex; flex-wrap: wrap; gap: .35rem; }
  .chip { padding: .35rem .6rem; border: 1px solid var(--rule); background: var(--card); border-radius: 999px; cursor: pointer; font-size: .8rem; transition: border-color .2s ease, background-color .2s ease; }
  .chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .search { min-width: 220px; }

  /* surfaces */
  .card { background: var(--card); border: 1px solid var(--rule); padding: 1rem 1.1rem; display: grid; gap: .7rem; align-content: start; min-width: 0; }
  .card h2 { margin: 0; font: 800 1.35rem/1 var(--f-display); text-transform: uppercase; }
  .card h3 { margin: 0; font: 700 .95rem/1.3 var(--f-body); }
  .label { font: 500 .62rem/1.3 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--steel); }
  .muted { color: var(--steel); }
  .small { font-size: .82rem; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .between { justify-content: space-between; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); gap: 1rem; align-items: start; }
  @media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin-bottom: 1rem; }
  .kpi { background: var(--card); padding: .9rem 1rem; display: grid; gap: .25rem; text-decoration: none; }
  .kpi strong { font: 800 2rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
  .kpi.alert strong { color: var(--magenta); }
  .empty { padding: 1.4rem; border: 1px dashed var(--rule); text-align: center; color: var(--steel); background: var(--card); }

  /* tables */
  .tbl { overflow-x: auto; border: 1px solid var(--rule); background: var(--card); }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th { text-align: left; font: 500 .6rem/1.3 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--steel); padding: .65rem .7rem; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  td { padding: .6rem .7rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr.click { cursor: pointer; transition: background-color .15s ease; }
  tbody tr.click:hover { background: var(--shade); }
  td.r, th.r { text-align: right; }
  .pill { display: inline-flex; align-items: center; gap: .3rem; padding: .15rem .5rem; border-radius: 999px; font: 600 .62rem/1.4 var(--f-mono); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; border: 1px solid currentColor; }
  .p-ok { color: var(--ok); } .p-warn { color: var(--warn); } .p-bad { color: var(--bad); } .p-info { color: var(--info); } .p-mut { color: var(--steel); } .p-acc { color: var(--magenta); }
  .tier { display: inline-grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 50%; font: 800 .85rem var(--f-display); color: var(--on-accent); }
  .tier.A { background: var(--magenta); } .tier.B { background: var(--warn); } .tier.C { background: var(--steel); }

  /* kanban */
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: .7rem; overflow-x: auto; padding-bottom: .6rem; align-items: start; }
  .lane { background: var(--shade); border: 1px solid var(--rule); padding: .55rem; display: grid; gap: .5rem; align-content: start; min-height: 140px; }
  .lane.drop { outline: 2px dashed var(--magenta); outline-offset: -4px; }
  .lane header { display: flex; justify-content: space-between; align-items: baseline; gap: .4rem; padding: .1rem .2rem .3rem; }
  .lane header b { font: 800 1.05rem/1 var(--f-display); text-transform: uppercase; }
  .opp { background: var(--card); border: 1px solid var(--rule); padding: .65rem .7rem; display: grid; gap: .3rem; cursor: grab; transition: box-shadow .2s ease, transform .2s ease; }
  .opp:hover { box-shadow: 0 8px 20px var(--shade); transform: translateY(-1px); }
  .opp.drag { opacity: .45; }
  .opp .t { font-weight: 600; line-height: 1.25; }
  .opp .m { display: flex; justify-content: space-between; gap: .4rem; font: 500 .7rem var(--f-mono); color: var(--steel); }
  .due-late { color: var(--bad) !important; font-weight: 600; }
  .due-today { color: var(--warn) !important; font-weight: 600; }

  /* timeline / steps */
  .steps { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--rule); background: var(--card); }
  .steps button { all: unset; cursor: pointer; flex: 1 1 90px; padding: .55rem .5rem; text-align: center; font: 600 .6rem/1.2 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--steel); border-right: 1px solid var(--rule); transition: background-color .2s ease; }
  .steps button:last-child { border-right: 0; }
  .steps button.done { color: var(--ok); }
  .steps button.now { background: var(--ink); color: var(--paper); }
  .log { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; }
  .log li { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: .6rem; font-size: .85rem; padding-bottom: .45rem; border-bottom: 1px dashed var(--rule); }
  .log li:last-child { border-bottom: 0; }
  .log time { font: 500 .68rem var(--f-mono); color: var(--steel); }

  /* schedule */
  .sched { overflow-x: auto; border: 1px solid var(--rule); background: var(--card); }
  .sched table { min-width: 980px; table-layout: fixed; }
  .sched th:first-child, .sched td:first-child { width: 170px; position: sticky; left: 0; background: var(--card); z-index: 1; }
  .sched td { padding: .35rem; height: 92px; }
  .sched th { line-height: 1.25; } .sched th.today { color: var(--magenta); }
  .slot { display: grid; gap: .25rem; align-content: start; height: 100%; padding: .2rem; border: 1px dashed transparent; transition: border-color .2s ease, background-color .2s ease; }
  .slot.drop { border-color: var(--magenta); background: color-mix(in srgb, var(--magenta) 6%, transparent); }
  .load { height: 6px; background: var(--shade); border-radius: 3px; overflow: hidden; }
  .load i { display: block; height: 100%; background: var(--ok); }
  .load.hi i { background: var(--warn); } .load.over i { background: var(--bad); }
  .job { font: 500 .66rem/1.25 var(--f-mono); padding: .25rem .35rem; background: var(--shade); border-left: 3px solid var(--magenta); cursor: grab; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job.late { border-left-color: var(--bad); }
  .queue { display: grid; gap: .4rem; }
  .queue .job { white-space: normal; padding: .45rem .55rem; font-size: .72rem; }

  /* scanning */
  .scan { display: grid; gap: 1rem; max-width: 760px; }
  .scan input.big { font: 600 2rem/1 var(--f-mono); padding: .9rem 1rem; text-transform: uppercase; letter-spacing: .06em; }
  .flash { animation: flash 1s ease; }
  @keyframes flash { 0% { background: color-mix(in srgb, var(--ok) 30%, var(--card)); } 100% { background: var(--card); } }
  video.cam { width: 100%; max-height: 320px; background: #000; object-fit: cover; }

  /* misc */
  .toast { position: fixed; z-index: 100; left: 50%; bottom: calc(1.2rem + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: var(--paper); padding: .75rem 1rem; font: 500 .8rem var(--f-mono); max-width: min(92vw, 520px); transition: opacity .25s ease, transform .3s ease; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { background: var(--bad); color: #fff; }
  dialog.modal { border: 1.5px solid var(--ink); padding: 0; background: var(--paper); color: var(--ink); width: min(720px, calc(100vw - 2rem)); max-height: calc(100dvh - 2rem); }
  dialog.modal::backdrop { background: rgba(10,8,10,.6); }
  dialog.modal header { display: flex; justify-content: space-between; align-items: center; padding: .7rem 1rem; background: var(--ink); color: var(--paper); font: 500 .68rem var(--f-mono); letter-spacing: .12em; text-transform: uppercase; }
  dialog.modal header button { all: unset; cursor: pointer; font-size: 1.2rem; padding: 0 .3rem; }
  dialog.modal .body { padding: 1rem; display: grid; gap: .8rem; overflow: auto; }
  .login { min-height: 100%; display: grid; place-items: center; padding: 1.5rem max(16px, env(safe-area-inset-right, 0px)) 1.5rem max(16px, env(safe-area-inset-left, 0px)); }
  .login form { width: min(400px, 100%); display: grid; gap: .9rem; background: var(--card); border: 1.5px solid var(--ink); padding: 1.4rem; }
  .login h1 { margin: 0; font: 900 2.4rem/.9 var(--f-display); text-transform: uppercase; }
  .err { color: var(--bad); font-size: .85rem; min-height: 1em; }
  .bar-h { display: flex; height: 10px; background: var(--shade); border-radius: 5px; overflow: hidden; }
  .bar-h i { display: block; height: 100%; }
  .money { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .totals { display: grid; grid-template-columns: 1fr auto; gap: .35rem 1rem; font-size: .9rem; }
  .totals .grand { font: 800 1.6rem/1 var(--f-display); }
  .lineitem { border: 1px solid var(--rule); background: var(--card); padding: .8rem; display: grid; gap: .6rem; }
  .ub { display: grid; grid-template-columns: minmax(0, 1.2fr) 90px minmax(0, 1fr) 2rem; gap: .4rem; align-items: end; }
  .x { all: unset; cursor: pointer; width: 2rem; height: 2rem; display: grid; place-items: center; border-radius: 50%; }
  .x:hover { background: var(--ink); color: var(--paper); }
  .hint { font-size: .8rem; color: var(--steel); }
  .barcode svg { display: block; width: 100%; max-width: 360px; height: 64px; }
  .thumbs { display: flex; flex-wrap: wrap; gap: .5rem; }
  .thumbs a { display: block; width: 110px; border: 1px solid var(--rule); background: #fff; }
  .thumbs img { display: block; width: 100%; height: 110px; object-fit: contain; }
  .thumbs span { display: block; font: 400 .6rem var(--f-mono); padding: .2rem .3rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #333; }
  .copybox { font: 400 .8rem/1.45 var(--f-mono); white-space: pre-wrap; background: var(--shade); padding: .7rem; border: 1px solid var(--rule); max-height: 260px; overflow: auto; }

  /* print: quote, traveler, packing list */
  #print { display: none; }

  /* ---------- internal quoter: form on the left, the client's sheet (paper) on the right ---------- */
  .cz-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 1.2rem; align-items: start; }
  @media (max-width: 1180px) { .cz-grid { grid-template-columns: minmax(0, 1fr); } }
  .cz-panel { background: var(--card); border: 1px solid var(--rule); padding: 1.1rem; display: grid; gap: 1.5rem; min-width: 0; }
  .cz-group { display: grid; gap: .75rem; min-width: 0; }
  .cz-group > h2 { margin: 0; font: 700 .78rem var(--f-mono); letter-spacing: .14em; text-transform: uppercase; padding-bottom: .4rem; border-bottom: 1.5px solid var(--ink); }
  .cz-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem .75rem; }
  .cz-fields.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cz-fields .full, .cz-line .full { grid-column: 1 / -1; }
  @media (max-width: 560px) { .cz-fields, .cz-fields.three { grid-template-columns: minmax(0, 1fr); } }
  .cz-f { display: grid; gap: .25rem; min-width: 0; }
  .cz-f > span { font: 500 .66rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--steel); }
  .cz .i.num, .cz-tq .i.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
  .cz textarea.i { min-height: 64px; resize: vertical; }
  .cz-status { font: 500 .68rem var(--f-mono); letter-spacing: .06em; color: var(--steel); }
  .cz-segrow { display: grid; gap: .35rem; }
  .cz-segrow > span { font: 500 .66rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--steel); }
  .cz-seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px; border: 1px solid var(--rule); background: var(--paper); justify-self: start; }
  .cz-seg button { border: 0; background: transparent; padding: .45rem .75rem; font: 500 .85rem var(--f-body); cursor: pointer; color: var(--ink); transition: background-color .15s ease; }
  .cz-seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .cz-check { display: flex; gap: .55rem; align-items: center; font-size: .9rem; cursor: pointer; }
  .cz-check input { width: 1rem; height: 1rem; accent-color: var(--ink); margin: 0; flex: none; }
  .cz-checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .45rem .8rem; }
  @media (max-width: 560px) { .cz-checks { grid-template-columns: minmax(0, 1fr); } }
  .cz-clienthint { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; font-size: .85rem; background: color-mix(in srgb, var(--magenta) 9%, var(--card)); padding: .55rem .7rem; }
  .cz-freqbox { display: grid; gap: .45rem; }
